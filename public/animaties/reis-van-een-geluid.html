<!doctype html>
<meta charset="utf-8">
<title>SoundScout — Eén geluid op reis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="/fonts/nunito/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/nunito.css">
<style>
  /* ===================================================================
     SOUNDSCOUT — "Eén geluid op reis" (designronde nov 2026)
     Eén doorlopende opname in het echte boerderijbeeld. Je volgt dezelfde
     vier geluidsblokken van hotspot → tas → tijdlijn → podium:
       1. Ontdek      de hotspots pulseren, een vinger tikt ze aan
       2. Verzamel    elk blok vliegt naar de tas
       3. Bouw        de blokken landen op de tijdlijn, de afspeellijn loopt
       4. Laat horen  het podium: lichten, "Nu te horen", sterren
     Stil (besluit Bert 17-11-2026). Eén rAF-klok: elke frame wordt de staat
     berekend uit t = (now - start) % PERIOD. Bij prefers-reduced-motion:
     een stilstaand eindbeeld. Maten in --u (1% van de breedte van het
     podium, gezet door de JS), zodat het ook werkt zonder container-units.
     Tekst staat in de JS (TEXTS), taal via ?lang=nl|en.
     =================================================================== */
  :root{
    --ss-font:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --amber:#FBBF24; --amber-ink:#78350F; --night:#0F172A; --fog:#F4F6F8;
    --ink:#1E293B; --muted:#64748B; --playhead:#EF4444; --u:8px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:transparent; font-family:var(--ss-font); color:var(--ink); }
  .film{ max-width:940px; margin:0 auto; display:grid; gap:10px; }
  .steps{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .step{ font-weight:800; font-size:14px; padding:6px 14px; border-radius:999px; background:var(--fog); color:var(--muted); }
  .step.on{ background:var(--amber); color:var(--amber-ink); }
  .stage{ position:relative; width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:var(--night); box-shadow:0 8px 30px rgba(20,30,50,.18); }
  .stage *{ position:absolute; }
  .scene{ inset:0; background:url(/images/hero/boerderij-1024.webp) center/cover; }
  .dim{ inset:0; background:var(--night); opacity:0; }
  .hot{ width:calc(var(--u)*7.2); height:calc(var(--u)*7.2); border-radius:50%; border:calc(var(--u)*.35) solid rgba(255,255,255,.92); transform:translate(-50%,-50%); box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.2) rgba(0,0,0,.35); }
  .hot i{ inset:calc(var(--u)*-.35); border-radius:50%; border:calc(var(--u)*.5) solid rgba(255,255,255,.7); }
  .chip{ border-radius:calc(var(--u)*1.4); display:flex; align-items:center; gap:calc(var(--u)*.8); padding:0 calc(var(--u)*1.2); color:#fff; font-weight:800; font-size:calc(var(--u)*1.9); white-space:nowrap; overflow:hidden; box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.2) rgba(0,0,0,.28); opacity:0; }
  .chip svg{ position:static; width:calc(var(--u)*2.4); height:calc(var(--u)*2.4); flex:none; }
  .chip span{ position:static; }
  .bag{ left:50%; bottom:3%; transform:translateX(-50%); display:flex; gap:calc(var(--u)*1.2); padding:calc(var(--u)*1.2) calc(var(--u)*1.6); border-radius:calc(var(--u)*2.2); background:rgba(15,23,42,.82); border:calc(var(--u)*.15) solid rgba(255,255,255,.18); }
  .bag b{ position:static; width:calc(var(--u)*9.5); height:calc(var(--u)*6); border-radius:calc(var(--u)*1.2); border:calc(var(--u)*.25) dashed rgba(255,255,255,.35); }
  .tray{ left:5%; right:5%; top:22%; bottom:10%; background:#fff; border-radius:calc(var(--u)*2.2); box-shadow:0 calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.35); opacity:0; }
  .track{ left:3%; right:3%; height:17%; border-radius:calc(var(--u)*1); background:var(--fog); }
  .playhead{ width:calc(var(--u)*.4); background:var(--playhead); border-radius:var(--u); box-shadow:0 0 var(--u) rgba(239,68,68,.6); opacity:0; }
  .light{ bottom:38%; width:42%; height:120%; transform-origin:50% 100%; clip-path:polygon(46% 100%,54% 100%,100% 0,0 0); opacity:0; mix-blend-mode:screen; }
  .nowpill{ left:50%; top:7%; transform:translateX(-50%); background:var(--amber); color:var(--amber-ink); font-weight:800; font-size:calc(var(--u)*2); padding:calc(var(--u)*.7) calc(var(--u)*2); border-radius:999px; white-space:nowrap; opacity:0; }
  .stars{ left:50%; top:21%; transform:translateX(-50%); display:flex; gap:var(--u); }
  .stars svg{ position:static; width:calc(var(--u)*5); height:calc(var(--u)*5); opacity:0; }
  .cursor{ width:calc(var(--u)*4.2); height:calc(var(--u)*4.2); border-radius:50%; background:rgba(255,255,255,.95); border:calc(var(--u)*.4) solid var(--night); transform:translate(-50%,-50%); box-shadow:0 calc(var(--u)*.4) var(--u) rgba(0,0,0,.4); opacity:0; }
</style>
<div class="film">
  <div class="steps" id="steps"></div>
  <div class="stage" id="stage" role="img"></div>
</div>
<script src="reis-van-een-geluid.js"></script>
