<!doctype html>
<meta charset="utf-8">
<title>SoundScout — In 4 stappen aan de slag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     SOUNDSCOUT — onboarding "In 4 stappen aan de slag"
     Eén samengestelde, herhalende animatie (4 acts). Eén rAF-klok:
     elke frame wordt de staat volledig berekend uit t = (now-start) % PERIOD.
     Huisstijl: Nunito, egale sample-kleuren (vaste hex), Lucide-iconen,
     rode afspeellijn #e5342b, radii 13/14px.
     =================================================================== */
  :root{
    --ss-font: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --line:#eceef1; --ruler:#9aa0a6; --playhead:#e5342b;
    --gold:#e8a200; --badge:#f08a24;
    --ink:#243244; --muted:#6b7280;
    --accent:#efc14e;              /* SoundScout-geel */
    --c-skate:#efc14e; --c-zand:#e0a56e; --c-drone:#4c9ad6;
    --c-vissen:#29b6c9; --c-voetbal:#68bf59; --c-robot:#9b59b6;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:transparent; font-family:var(--ss-font); color:var(--ink); }

  .film{ max-width:940px; margin:0 auto; background:#fff; position:relative;
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 8px 30px rgba(20,30,50,.08); }

  /* ---- kopbalk met "Stap N" ---- */
  .stepbar{ display:flex; align-items:center; gap:14px; padding:16px 20px;
    border-bottom:1px solid var(--line); }
  .stepnum{ flex:0 0 auto; width:46px; height:46px; border-radius:50%;
    background:var(--accent); color:#4a3b00; font-weight:800; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(239,193,78,.5); }
  .steptxt .k{ font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .steptxt .t{ font-size:19px; font-weight:800; color:var(--ink); line-height:1.15; margin-top:1px; }

  /* ---- witte titelkaart vóór elke stap ---- */
  .titlecard{ position:absolute; inset:0; background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 10%; opacity:0; z-index:50; }
  .tc-num{ width:96px; height:96px; border-radius:50%; background:var(--accent); color:#4a3b00;
    font-weight:800; font-size:44px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(239,193,78,.55); margin-bottom:22px; }
  .tc-k{ font-size:14px; font-weight:800; letter-spacing:.18em; color:var(--muted); text-transform:uppercase; }
  .tc-t{ font-size:40px; font-weight:800; color:var(--ink); line-height:1.15; margin:10px 0 14px; }
  .tc-d{ font-size:18px; color:var(--muted); line-height:1.5; max-width:620px; }

  /* ---- podium met acts ---- */
  .stage{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#fbfcfd; }
  .act{ position:absolute; inset:0; opacity:0; will-change:opacity,transform; }
  .pad{ position:absolute; inset:24px; }

  /* ---- gedeeld: sample-chip / clip ---- */
  .chip{ display:inline-flex; align-items:center; gap:7px; padding:0 12px; height:34px;
    border-radius:11px; color:#fff; font-weight:700; font-size:14px; white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.14); }
  .chip svg, .lib svg, .clip svg, .slot svg{ width:15px; height:15px; }
  .c-skate{background:var(--c-skate)} .c-drone{background:var(--c-drone)}
  .c-vissen{background:var(--c-vissen)} .c-voetbal{background:var(--c-voetbal)}
  .c-robot{background:var(--c-robot)} .c-zand{background:var(--c-zand)}

  /* ---- ACT 1 : locatie + hotspots ---- */
  .loc{ position:absolute; inset:0; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    background:
      radial-gradient(120% 90% at 50% 8%, #fff5e0 0%, transparent 45%),
      radial-gradient(90% 70% at 80% 90%, #ffe6cf 0%, transparent 50%),
      linear-gradient(#fef4e2, #f6ead6); }
  .floor{ position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(#f0c98d,#e9b877); border-top:2px solid #e2a95f; }
  .obj{ position:absolute; border-radius:50%; box-shadow:0 4px 10px rgba(0,0,0,.10); }
  .bench{ position:absolute; border-radius:8px; background:#c98a4e; box-shadow:0 4px 10px rgba(0,0,0,.12); }
  .rope{ position:absolute; width:4px; background:#d8b98f; border-radius:2px; }
  .hot{ position:absolute; transform:translate(-50%,-50%) scale(0); opacity:0; width:46px; height:46px; will-change:transform,opacity; z-index:6;}
  .hot .ring{ width:100%; height:100%; border-radius:50%; background:rgba(255,255,255,.94);
    border:3px solid var(--gold); box-shadow:0 3px 9px rgba(0,0,0,.20); display:flex; align-items:center; justify-content:center; }
  .hot .ring svg{ width:20px; height:20px; color:#6b5300; }
  .hot .pulse{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--gold); opacity:0; }
  .cursor{ position:absolute; left:0; top:0; width:30px; height:30px; opacity:0; z-index:30; pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }

  /* ---- ACT 2 : recorder ---- */
  .rec{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px;
    box-shadow:0 6px 20px rgba(20,30,50,.06); }
  .rec-h{ display:flex; align-items:center; gap:8px; font-weight:800; color:var(--ink); margin-bottom:12px; }
  .rec-h .cnt{ margin-left:8px; font-size:13px; font-weight:800; color:var(--muted); }
  .rec-h svg{ width:18px; height:18px; color:var(--c-drone); }
  .slots{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .slot{ position:relative; height:66px; border-radius:12px; border:2px dashed #d3d7dc; overflow:hidden; }
  .slot .leeg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#aab0b6; font-size:13px; font-weight:700; }
  .slot .cin{ position:absolute; inset:0; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:5px; color:#fff; font-size:12px; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.14); opacity:0; transform:translateY(-110%); }
  .slot .cin svg{ width:20px; height:20px; }
  .slot.fill{ border-style:solid; border-color:transparent; }

  /* ---- ACT 3 + 4 : studio / tijdlijn ---- */
  .lib-h,.tl-h{ font-size:11px; font-weight:800; letter-spacing:.13em; color:var(--muted); margin:0 0 8px 2px; }
  .lib{ display:flex; gap:10px; }
  .lib .chip{ opacity:1; }
  .tl{ position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
  .ruler{ margin-left:30px; display:grid; grid-template-columns:repeat(9,1fr); height:20px; border-bottom:1px solid var(--line); }
  .ruler span{ font-size:10px; color:var(--ruler); padding-left:5px; border-left:1px solid var(--line); line-height:20px; }
  .grid-wrap{ display:grid; grid-template-columns:30px 1fr; }
  .rnums{ display:grid; grid-auto-rows:42px; }
  .rnums div{ display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ruler); border-bottom:1px solid var(--line); }
  .area{ position:relative; display:grid; grid-template-columns:repeat(9,1fr); grid-auto-rows:42px;
    background-image:
      repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/9)),
      repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 42px); }
  .clip{ margin:5px 3px; border-radius:11px; color:#fff; display:flex; align-items:center; gap:6px; padding:0 10px;
    font-size:12px; font-weight:700; box-shadow:0 2px 5px rgba(0,0,0,.14); opacity:0; overflow:hidden; white-space:nowrap;
    will-change:transform,opacity,filter; }
  .playhead{ position:absolute; top:-20px; bottom:0; left:0; width:2px; background:var(--playhead); opacity:0; }
  .playhead::before{ content:""; position:absolute; top:-4px; left:-4px; width:10px; height:10px; border-radius:50%; background:var(--playhead); }
  .drag{ position:absolute; left:0; top:0; opacity:0; z-index:20; }
  .tlbg{ position:absolute; left:10%; right:10%; top:9%; height:46%; border:1px solid var(--line);
    border-radius:10px; overflow:hidden; background:#fff;
    background-image:
      repeating-linear-gradient(to right,#eef1f4 0 1px,transparent 1px calc(100%/8)),
      repeating-linear-gradient(to bottom,#eef1f4 0 1px,transparent 1px calc(100%/3)); }
  .tlbg::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:rgba(229,52,43,.35); }

  /* ---- ACT 4 : bewerken ---- */
  .editclip{ position:absolute; left:14%; top:16%; height:56px; width:44%; border-radius:13px; color:#fff;
    display:flex; align-items:center; gap:8px; padding:0 14px; font-weight:700; font-size:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.16); outline:3px solid rgba(76,154,214,.55); outline-offset:2px; }
  .handle{ position:absolute; right:-3px; top:50%; transform:translateY(-50%); width:12px; height:70%;
    border-radius:6px; background:rgba(255,255,255,.85); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .vol{ position:absolute; left:14%; right:14%; top:62%; }
  .vol-lab{ font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .vol-lab svg{ width:16px; height:16px; color:var(--c-drone); }
  .track{ position:relative; height:8px; border-radius:5px; background:#e7ebf0; }
  .vol-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--c-drone); width:50%; }
  .thumb{ position:absolute; top:50%; left:50%; width:22px; height:22px; border-radius:50%; background:#fff;
    border:3px solid var(--c-drone); transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .bars{ position:absolute; right:0; top:-46px; display:flex; align-items:flex-end; gap:3px; height:34px; }
  .bars i{ width:5px; background:var(--c-drone); border-radius:2px; display:block; }
  .done{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; opacity:0; }
  .done .ic{ width:52px; height:52px; margin:0 auto 6px; color:var(--c-voetbal); } .done .ic svg{ width:52px; height:52px; }
  .done .t{ font-weight:800; font-size:18px; color:var(--ink); }

  /* ---- voortgangsstippen ---- */
  .dots{ display:flex; gap:8px; justify-content:center; padding:14px 0 16px; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:#dfe3e8; transition:none; }
</style>

<div class="film">
  <div class="stepbar">
    <div class="stepnum" id="stepnum">1</div>
    <div class="steptxt"><div class="k" id="stepk"></div><div class="t" id="steptitle"></div></div>
  </div>

  <div class="stage" id="stage">
    <!-- ACT 1 -->
    <div class="act" id="act1">
      <div class="pad">
        <div class="loc">
          <div class="floor"></div>
          <div class="rope"  style="left:34%; top:6%; height:26%"></div>
          <div class="rope"  style="left:40%; top:6%; height:26%"></div>
          <div class="obj" style="left:60%; top:70%; width:56px; height:56px; background:radial-gradient(circle at 35% 30%,#fff,#e77 60%,#b33)"></div>
          <div class="bench" style="left:8%; top:60%; width:150px; height:16px"></div>
          <div class="obj" style="left:80%; top:40%; width:30px; height:30px; background:radial-gradient(circle at 35% 30%,#fff,#5bd 60%,#37a)"></div>
        </div>
        <svg class="cursor" id="cursor1" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 14.6 L11.6 21.4 L14.3 20.2 L11.2 13.6 L17.5 13.6 Z" fill="#fff" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- ACT 2 -->
    <div class="act" id="act2"><div class="pad">
      <div class="rec">
        <div class="rec-h"><span class="ic-mic"></span><span id="lblRecorder"></span><span class="cnt" id="reccnt">0/6</span></div>
        <div class="slots" id="slots"></div>
      </div>
    </div></div>

    <!-- ACT 3 -->
    <div class="act" id="act3"><div class="pad">
      <div class="lib-h" id="lblLibrary"></div>
      <div class="lib" id="lib"></div>
      <div class="tl-h" id="lblTimeline" style="margin-top:18px"></div>
      <div class="tl">
        <div class="ruler" id="ruler"></div>
        <div class="grid-wrap">
          <div class="rnums" id="rnums"></div>
          <div class="area" id="area"><div class="playhead" id="playhead"></div></div>
        </div>
      </div>
      <div class="drag chip" id="drag"></div>
    </div></div>

    <!-- ACT 4 -->
    <div class="act" id="act4"><div class="pad">
      <div class="tlbg"></div>
      <div class="editclip c-drone" id="editclip"><span class="ic-waves"></span><span id="lblEditClip"></span><div class="handle"></div></div>
      <div class="vol" id="vol">
        <div class="vol-lab"><span class="ic-vol"></span><span id="lblVolume"></span></div>
        <div class="track"><div class="vol-fill" id="volfill"></div><div class="thumb" id="volthumb"></div>
          <div class="bars" id="bars"></div>
        </div>
      </div>
      <div class="done" id="done"><div class="ic ic-spark"></div><div class="t" id="lblDone"></div></div>
      <svg class="cursor" id="cursor4" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 14.6 L11.6 21.4 L14.3 20.2 L11.2 13.6 L17.5 13.6 Z" fill="#fff" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div></div>

  </div>

  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>

  <div class="titlecard" id="titlecard">
    <div class="tc-num" id="tcNum">1</div>
    <div class="tc-k" id="tcK"></div>
    <div class="tc-t" id="tcT"></div>
    <div class="tc-d" id="tcD"></div>
  </div>
</div>

<script src="./onboarding-4-stappen.js"></script>
