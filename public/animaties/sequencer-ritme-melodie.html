<!doctype html>
<meta charset="utf-8">
<title>SoundScout — Ritme en melodie in de sequencer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="/fonts/nunito/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/nunito.css">
<style>
  /* ===================================================================
     SOUNDSCOUT — "Ritme en melodie in de sequencer" (designronde nov 2026)
     Vervangt "Zo werkt de sequencer": één stille animatie voor beide soorten
     sequences, in vier acts:
       1. Kies             "Wat wil je maken?" → Ritme of Melodie
       2. Ritme            vakjes per geluid, elk spoor in de kleur van zijn geluid
       3. Melodie          vakjes per noot (C–B), één klank
       4. Op de tijdlijn   "Klaar" maakt er een gestippeld blok van dat herhaalt
     Eén rAF-klok (t = (now - start) % PERIOD), stilstaand eindbeeld bij
     prefers-reduced-motion, maten in --u (1% van de podiumbreedte).
     Tekst staat in de JS (TEXTS), taal via ?lang=nl|en.
     =================================================================== */
  :root{
    --ss-font:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --amber:#FBBF24; --amber-pressed:#F59E0B; --amber-ink:#78350F; --night:#0F172A;
    --fog:#F4F6F8; --hairline:#E2E8F0; --ink:#1E293B; --muted:#64748B; --playhead:#EF4444; --u:8px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:transparent; font-family:var(--ss-font); color:var(--ink); }
  .film{ max-width:940px; margin:0 auto; display:grid; gap:10px; }
  .steps{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .step{ font-weight:800; font-size:14px; padding:6px 14px; border-radius:999px; background:var(--fog); color:var(--muted); }
  .step.on{ background:var(--amber); color:var(--amber-ink); }
  .stage{ position:relative; width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#fff; border:1px solid var(--hairline); box-shadow:0 8px 30px rgba(20,30,50,.08); }
  .stage *{ position:absolute; }
  .layer{ inset:0; opacity:0; }
  .card{ width:30%; height:44%; top:28%; border-radius:calc(var(--u)*2.4); border:calc(var(--u)*.35) solid var(--hairline); background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*1.4); font-weight:800; font-size:calc(var(--u)*2.6); }
  .card svg, .card span{ position:static; }
  .card svg{ width:calc(var(--u)*8); height:calc(var(--u)*8); color:var(--amber-pressed); }
  .card.on{ border-color:var(--amber); background:#FFFBEB; }
  .ask{ left:0; right:0; top:9%; text-align:center; font-weight:800; font-size:calc(var(--u)*3); }
  .name{ left:5%; width:13%; border-radius:calc(var(--u)*1.2); color:#fff; font-weight:800; font-size:calc(var(--u)*1.8); display:flex; align-items:center; justify-content:center; }
  .note{ left:12%; width:6%; color:var(--muted); font-weight:800; font-size:calc(var(--u)*1.8); display:flex; align-items:center; justify-content:flex-end; }
  .cell{ border-radius:calc(var(--u)*1.1); background:var(--fog); border:calc(var(--u)*.25) solid var(--hairline); }
  .now{ border-radius:calc(var(--u)*1.4); border:calc(var(--u)*.45) solid var(--night); opacity:0; }
  .done{ right:6%; bottom:5%; padding:calc(var(--u)*1) calc(var(--u)*2.6); border-radius:calc(var(--u)*1.6); background:var(--amber); color:var(--amber-ink); font-weight:800; font-size:calc(var(--u)*2.2); box-shadow:0 calc(var(--u)*.5) 0 0 rgba(180,83,9,.5); opacity:0; }
  .seqchip{ border-radius:calc(var(--u)*1.3); border:calc(var(--u)*.3) dotted rgba(15,23,42,.55); color:#fff; font-weight:800; font-size:calc(var(--u)*1.9); display:flex; align-items:center; padding:0 calc(var(--u)*1.4); white-space:nowrap; overflow:hidden; opacity:0; background-image:radial-gradient(rgba(255,255,255,.28) calc(var(--u)*.22),transparent calc(var(--u)*.24)); background-size:calc(var(--u)*1.2) calc(var(--u)*1.2); }
  .seqchip span{ position:static; }
  .seqchip i{ top:0; bottom:0; width:calc(var(--u)*.3); background:rgba(255,255,255,.75); opacity:0; }
  .tray{ left:5%; right:5%; top:44%; bottom:6%; border-radius:calc(var(--u)*2); background:var(--fog); border:1px solid var(--hairline); opacity:0; }
  .track{ left:3%; right:3%; height:32%; border-radius:var(--u); background:#E2E8F0; }
  .playhead{ width:calc(var(--u)*.4); background:var(--playhead); border-radius:var(--u); box-shadow:0 0 var(--u) rgba(239,68,68,.5); opacity:0; }
  .cursor{ width:calc(var(--u)*4); height:calc(var(--u)*4); border-radius:50%; background:rgba(255,255,255,.96); border:calc(var(--u)*.4) solid var(--night); transform:translate(-50%,-50%); box-shadow:0 calc(var(--u)*.4) var(--u) rgba(0,0,0,.3); opacity:0; }
</style>
<div class="film">
  <div class="steps" id="steps"></div>
  <div class="stage" id="stage" role="img"></div>
</div>
<script src="sequencer-ritme-melodie.js"></script>
