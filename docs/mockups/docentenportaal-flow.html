<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docentenportaal — volledige flow</title>
<style>
:root{
  --b900:#0f172a;--b800:#1e293b;--b700:#334155;--b600:#475569;--b500:#64748b;--b400:#94a3b8;--b300:#cbd5e1;--b200:#e2e8f0;--b100:#f1f5f9;--b50:#f8fafc;
  --a50:#fffbeb;--a100:#fef3c7;--a200:#fde68a;--a300:#fcd34d;--a400:#fbbf24;--a500:#f59e0b;--a700:#b45309;--a800:#92400e;--a900:#78350f;
  --teal:#0f766e;--teal1:#ccfbf1;--purp:#7e22ce;--purp1:#f3e8ff;--rose:#be123c;--rose1:#ffe4e6;
  --ok1:#dcfce7;--ok5:#22c55e;--ok7:#15803d;--warn1:#fef9c3;--warn2:#fde68a;--warn7:#a16207;--err:#dc2626;--err1:#fee2e2;
  --main:#0f172a;--muted:#64748b;--line:#e2e8f0;--app:#f1f5f9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,"Avenir Next",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;background:#dfe3ea;color:var(--main);line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{letter-spacing:-.3px}
.hidden{display:none!important}
.ico{display:inline-block;vertical-align:-.15em;flex:none}
.stars button .ico{fill:none}.stars button.on .ico{fill:currentColor}
.t-pp{--tc:#0f766e;--tb:#f0fdfa;--tl:#99f6e4;--ti:#14b8a6}.t-sb{--tc:#7e22ce;--tb:#faf5ff;--tl:#e9d5ff;--ti:#a855f7}.t-tp{--tc:#b45309;--tb:#fffbeb;--tl:#fde68a;--ti:#f59e0b}.t-fr{--tc:#be123c;--tb:#fff1f2;--tl:#fecdd3;--ti:#f43f5e}
.typeic{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--tb);color:var(--ti);border:1px solid var(--tl)}
.pick.vorm{background:var(--tb);border-color:var(--tl)}
.pick.vorm .vic{color:var(--ti);font-size:26px;display:flex}
.pick.vorm:hover{border-color:var(--ti)}
.pick.vorm.sel{border-color:var(--tc);background:var(--tb);box-shadow:0 0 0 3px var(--tl)}
.wzside{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:12px}
.wzbtns{display:flex;flex-direction:column;gap:8px;width:200px}
.how{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.how ol{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.how li{background:var(--app);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.how li .nr{width:36px;height:36px;border-radius:50%;background:var(--b900);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.lp{position:relative}.lp img{width:100%;display:block}
.lp .hot{position:absolute;border:3px solid var(--a500);border-radius:999px;background:rgba(251,191,36,.12);animation:pl 1.6s infinite;cursor:pointer}

/* ===== Mockup-chrome ===== */
.mb{position:sticky;top:0;z-index:80;background:#111;color:#eee;font-size:13px}
.mb .r1{display:flex;gap:6px;align-items:center;padding:7px 10px;flex-wrap:wrap}
.mb b.t{color:var(--a400);margin-right:4px}
.mb button,.mb select{background:#262626;border:1px solid #444;border-radius:999px;padding:5px 11px;color:#eee}
.mb button.on{background:var(--a400);color:#111;border-color:var(--a400);font-weight:800}
.mb .sp{flex:1}
.mb .exp{background:#14532d;border-color:#166534}
.mb .tour{display:flex;gap:6px;align-items:center;background:#1c1c1c;padding:6px 10px;border-top:1px solid #333;flex-wrap:wrap}
.mb .tour .cap{flex:1;min-width:200px;color:#ddd}
.mb .tour .cap b{color:var(--a400)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;max-width:1700px;margin:0 auto;padding:14px}
@media (max-width:1100px){.stage{grid-template-columns:1fr}}
.frame{margin:0 auto;border:9px solid #1f2937;border-radius:18px;background:var(--app);overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18);transition:max-width .25s;width:100%}
.frame.laptop{max-width:1280px}.frame.board{max-width:1600px;border-color:#0b1020}.frame.tablet{max-width:820px}.frame.phone{max-width:390px;border-radius:28px}
.app{container-type:inline-size;container-name:app;position:relative;min-height:640px;background:var(--app)}
.frame.board .app{min-height:0}
.notes{display:flex;flex-direction:column;gap:10px;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;padding-bottom:20px}
@media (max-width:1100px){.notes{position:static;max-height:none}}
.nh{background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;border:1px solid var(--line)}
.nh b{font-size:15px}
.note{background:#fff7d6;border:2px dashed #f5c518;border-radius:12px;padding:7px 9px;font-size:13px;scroll-margin-top:110px}
.note.flash{animation:fl 1s 2}
@keyframes fl{50%{background:#ffe680}}
.note label{display:flex;gap:6px;align-items:center;font-weight:800;color:#7a5b00;margin-bottom:4px}
.note label .num{background:#f59e0b;color:#fff;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.note label .s{margin-left:auto;font-weight:600;font-size:11px;color:#8a7a3a}
.note textarea{width:100%;min-height:54px;border:1px solid #e6cf73;border-radius:8px;padding:6px 8px;background:#fffdf3;resize:vertical;font-size:13px}
.why{font-size:12.5px;color:#334155;background:#eef2ff;border-left:4px solid #6366f1;padding:7px 10px;border-radius:8px}
.pz{position:relative}
.ps-card>.pin,.ps-side>.pin,.ps-pill>.pin,.lobby>.pin,.drawer>.pin{top:4px;left:4px}
.pin{position:absolute;top:-9px;left:-9px;z-index:30;background:#f59e0b;color:#fff;border:2px solid #fff;border-radius:999px;min-width:22px;height:22px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;padding:0 4px;line-height:1}
body.nopins .pin{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;z-index:300;font-weight:700;font-size:14px;max-width:90vw;text-align:center}

/* ===== App ===== */
.hd{background:var(--b900);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd .lg{font-weight:900;font-size:18px}.hd .lg span{color:var(--a400)}
.hd .crumb{font-size:12px;color:var(--b300)}
.hd .ttl{font-weight:900;font-size:19px}
.hd .r{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--b300)}
.hd .r a{color:inherit;text-decoration:none;cursor:pointer}
.hd .back{background:var(--b800);border:0;border-radius:999px;color:#fff;padding:6px 12px;font-weight:800;font-size:13px}
.wrap{padding:16px;max-width:1040px;margin:0 auto}
.btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;text-align:center}
.btn.p{background:var(--a400);border-color:var(--a400);color:var(--a900)}
.btn.p:hover{background:var(--a500);border-color:var(--a500)}
.btn.b{background:var(--b900);border-color:var(--b900);color:#fff}
.btn.d{background:var(--b800);border-color:var(--b800);color:#fff}
.btn.g{background:transparent;border-color:transparent;color:var(--muted)}
.btn.r{color:var(--err)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn.lg{min-height:54px;font-size:17px;padding:10px 22px}
.btn.xl{min-height:64px;font-size:20px;padding:12px 28px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.mut{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.b9{font-weight:900}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:900;letter-spacing:.12em;background:var(--a100);color:var(--a900);border-radius:12px;padding:2px 12px;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.c-new{background:var(--a100);color:var(--a700)}.c-seen{background:var(--b100);color:var(--b600)}.c-done{background:var(--ok1);color:var(--ok7)}.c-wip{background:var(--warn1);color:var(--warn7)}
.c-pp{background:var(--teal1);color:var(--teal)}.c-sb{background:var(--purp1);color:var(--purp)}.c-tp{background:var(--a100);color:var(--a700)}.c-fr{background:var(--rose1);color:var(--rose)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--a500);display:inline-block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--b100);display:block}
.ph{display:flex;align-items:center;justify-content:center;font-size:30px;aspect-ratio:16/9;border-radius:10px;background:var(--b100)}
.tabsL{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;margin:14px 0}
.tabsL button{flex:1;border:0;background:none;border-radius:12px;padding:10px 6px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14.5px}
.tabsL button small{font-weight:600;font-size:11.5px}
.tabsL button.on{background:var(--b900);color:#fff}
.tabsL button.on small{color:var(--b300)}
.listrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px;text-align:left;width:100%}
.listrow .grow{flex:1;min-width:0}
.listrow.sel{border:2px solid var(--a400);background:var(--a50)}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tile .n{font-weight:900}.tile .t{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{flex:1;min-width:120px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;text-align:left}
.counter b{font-size:30px;display:block;line-height:1}
.counter.on{border-color:var(--a400);background:var(--a50)}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;color:var(--ok7)}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok5);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
details.more{border:1px solid var(--line);border-radius:12px;background:var(--b50);padding:2px 12px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:800;padding:9px 0;color:var(--b700)}
.opt{display:grid;grid-template-columns:200px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.opt select,.opt input{padding:7px 9px;border:2px solid var(--line);border-radius:10px;background:#fff;width:100%;max-width:300px}
.switch{width:42px;height:24px;border-radius:999px;background:var(--b300);position:relative;border:0;padding:0;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--a400)}.switch.on:after{left:21px}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;padding:20px}
.modal.wide{max-width:760px}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps span:not(.pin){font-size:12.5px;font-weight:800;border-radius:999px;padding:5px 11px;background:var(--b100);color:var(--muted)}
.steps span.on:not(.pin){background:var(--b900);color:#fff}
.steps span.done:not(.pin){background:var(--ok1);color:var(--ok7)}
.steps i{color:var(--b300);font-style:normal}
.pick{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--a300)}
.pick.sel{border-color:var(--a400);background:var(--a50)}
.pick .ic{font-size:26px}
.phoneprev{width:200px;border:7px solid #111;border-radius:24px;background:#fff;overflow:hidden;font-size:11px;flex:none}
.phoneprev .h{background:var(--b900);color:#fff;padding:7px 9px;font-weight:800;font-size:12px}
.phoneprev .bd{padding:8px}
.phoneprev ul{padding-left:14px;margin:4px 0}
.phoneprev .go{background:var(--a400);border-radius:999px;text-align:center;padding:5px;font-weight:900;margin-top:6px}
.lobby{background:var(--b900);color:#fff;text-align:center;padding:28px 16px;min-height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
.lobby .bigcode{font-family:ui-monospace,Menlo,monospace;font-weight:900;letter-spacing:.12em;font-size:clamp(70px,16cqi,190px);line-height:1}
.lobby .url{font-size:clamp(18px,3cqi,32px);font-weight:800}.lobby .url span{color:var(--a400)}
.names{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:680px}
.names span{background:var(--b800);border-radius:999px;padding:4px 12px;font-weight:800;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;color:var(--main);z-index:20;box-shadow:-10px 0 40px rgba(0,0,0,.35);padding:16px;overflow:auto;text-align:left}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px;font-weight:800;text-align:left;min-height:50px;font-size:13.5px}
.stk button.on{border-color:var(--a400);background:var(--a100)}
.stars button{border:0;background:none;font-size:32px;color:#cbd5e1;padding:0 2px;line-height:1}
.stars button.on{color:var(--a400)}
.tipchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tipchips button{border:1px solid var(--line);background:var(--b50);border-radius:999px;padding:5px 10px;font-size:12.5px}
textarea.fbt{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:56px}
/* montagelijn (tijdlijn) */
.tl{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;touch-action:none;user-select:none;cursor:pointer}
.tl .ru{height:20px;background:var(--b50);border-bottom:1px solid var(--line);display:flex;font-size:10px;color:var(--muted)}
.tl .ru span{flex:1;border-left:1px solid var(--line);padding-left:3px}
.tl .tr{height:26px;border-bottom:1px solid var(--b100);position:relative}
.tl .tr i{position:absolute;top:3px;bottom:3px;border-radius:5px;font-style:normal;font-size:10.5px;font-weight:800;color:#111;padding:3px 6px;overflow:hidden;white-space:nowrap}
.tl .ph2{position:absolute;top:0;bottom:0;width:3px;background:#ef4444;pointer-events:none}
.tl .ph2:before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:#ef4444}
/* presentatie (zoals nu) */
.ps{background:var(--b900);display:flex;flex-direction:column;height:min(78vh,820px);min-height:560px;color:#fff;position:relative}
.frame.board .ps{height:auto;aspect-ratio:16/9;min-height:0}
.ps-top{display:flex;align-items:center;gap:8px;padding:9px 12px}
.ps-pill{background:rgba(30,41,59,.85);color:var(--b100);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ps-ic{background:none;border:0;color:var(--b300);width:38px;height:38px;border-radius:10px;font-size:17px}
.ps-ic:hover{background:var(--b800);color:#fff}
.ps-ic.on{color:var(--a400);background:var(--b800)}
.ps-body{flex:1;min-height:0;display:flex;gap:10px;padding:0 10px;position:relative}
.ps-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ps-card{flex:1;min-height:0;background:#fff;color:var(--main);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ps-vis{flex:1;min-height:0;background:var(--b50);display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.ps-vis .ib{position:relative;height:100%;max-width:100%;aspect-ratio:1920/1072}
.ps-vis .ib img{width:100%;height:100%;object-fit:contain;border-radius:10px;display:block}
.ps-spot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--a400);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--b700)}
.ps-spot.cur{background:var(--a400);transform:translate(-50%,-50%) scale(1.3)}
.ps-title{padding:9px 16px;border-top:1px solid var(--line);font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-title span{font-weight:600;color:var(--muted)}
.ps-ctl{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;flex-wrap:wrap}
.ps-tb{width:44px;height:44px;border-radius:50%;border:0;background:var(--b800);color:#fff;font-size:17px}
.ps-tb.pl{width:56px;height:56px;background:var(--a400);color:#fff;font-size:22px}
.ps-tg{border:0;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;background:var(--b800);color:var(--b300)}
.ps-tg.on{background:var(--a400);color:var(--a900)}
.ps-side{width:270px;flex:none;background:#fff;color:var(--main);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.ps-side .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px}
.ps-side ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.ps-side li button{width:100%;text-align:left;border:2px solid transparent;background:none;border-radius:12px;padding:6px 8px;display:flex;gap:8px;align-items:center}
.ps-side li button.cur{border-color:var(--a400);background:var(--a50)}
.ps-side li .ico{width:32px;height:32px;border-radius:9px;background:var(--b100);display:flex;align-items:center;justify-content:center;flex:none}
.ps-side li button.cur .ico{background:var(--a400);color:#fff}
.ps-edge{position:absolute;right:0;top:50%;transform:translateY(-50%);background:#fff;color:var(--main);border:0;border-radius:12px 0 0 12px;padding:10px 7px;font-weight:900;font-size:12px;z-index:5}
.ps-ann{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(15,23,42,.95);border-radius:16px;padding:12px 26px;text-align:center;z-index:6;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.ps-ann b{display:block;font-size:24px}
.ps-fb{background:#fff;color:var(--main);border-radius:12px;margin-top:8px;padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ps-fb .ics button{width:40px;height:40px;border-radius:11px;border:0;background:var(--b100);font-size:18px;margin-right:3px}
.ps-fb .ics button.on{background:var(--a100);outline:2px solid var(--a400)}
/* feedback-werklijst */
.fbw{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start}
.fb-item{width:100%;text-align:left;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px}
.fb-item.cur{border-color:var(--a400);background:var(--a50)}
.fb-item .grow{flex:1;min-width:0}
.fb-item .t{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-acc{border:2px solid var(--a400);border-top:0;border-radius:0 0 14px 14px;margin:-8px 0 8px;padding:14px 12px 12px;background:#fff}
.vis-pp{position:relative;border-radius:12px;overflow:hidden}
.vis-pp img{width:100%;display:block}
.vis-pp .mk{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--a400);border:3px solid #fff;box-shadow:0 0 0 3px var(--a400)}
.vis-sb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vis-sb div{position:relative}
.vis-sb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;opacity:.55}
.vis-sb div.on img{opacity:1;outline:3px solid var(--a400)}
.vis-sb span{position:absolute;left:6px;bottom:4px;color:#fff;font-weight:800;font-size:11px;text-shadow:0 1px 3px #000}
/* kaart */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.mapn{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.mapn:hover{border-color:var(--a400)}
.mapn .k{font-size:11px;font-weight:900;color:var(--a700)}
.mapn .arrow{position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--b400);font-size:18px}
.lane{background:#fff8;border-radius:16px;padding:12px;margin-bottom:12px}
.lane h3{font-size:14px;margin-bottom:8px;color:var(--b600)}

/* ===== Responsief op de breedte van het apparaat-frame ===== */
@container app (max-width: 760px){
  .wrap{padding:12px}
  .fbw{grid-template-columns:1fr}
  .fb-desk{display:none!important}
  .ps-side{position:absolute;right:10px;top:0;bottom:0;width:82%;z-index:8;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
  .opt{grid-template-columns:1fr}
  .stk{grid-template-columns:repeat(2,1fr)}
  .wz{grid-template-columns:1fr!important}
  .wz .prevwrap{display:none}
  .wzside{position:sticky;bottom:0;top:auto;background:var(--app);padding:10px 0 6px;border-top:1px solid var(--line);z-index:6}
  .wzbtns{width:100%;flex-direction:row-reverse}.wzbtns .btn{flex:1}
  .how ol{grid-template-columns:1fr}
  .lp-desk{display:none}
  .cls-hero{grid-template-columns:1fr!important}
  .hide-s{display:none!important}
  .map{grid-template-columns:1fr 1fr}
  .tabsL button small{display:none}
  .hd .r .hide-s{display:none}
  .ps-ctl .ps-tg span{display:none}
}
@container app (min-width: 761px){ .fb-mob{display:none!important} .show-s{display:none!important} .lp-mob{display:none} }
</style>
</head>

  else if (n==='dash-empty') html=scrDash(true);
  else if (n==='lessen') html=scrLessen();
  else if (n==='materiaal') html=scrMateriaal();
  else if (n==='wiz1') html=scrWiz1();
  else if (n==='wiz2') html=scrWiz2();
  else if (n==='wiz3') html=scrWiz3();
  else if (n.startsWith('klas')) html=scrKlas();
  else if (n==='pres') html=scrPres();
  else if (n==='fb') html=scrFb();
  else if (n==='peer') html=scrPeer();
  if (MODAL) html += modalHTML();
  app.innerHTML = html;
  renderNotes();
  document.getElementById('jump').value = n;
  document.querySelectorAll('[data-dev]').forEach(b=>b.classList.toggle('on', b.dataset.dev===dev()));
  tourCap();
  afterRender();
}
function dev(){ return store.ui.dev || 'laptop'; }

function pGo(i){ const L=presList(); if (i<0||i>=L.length) return; P.i=i; P.pos=0; P.playing=true; annBlink(); render(); }
let annT=null; function annBlink(){ P.ann=true; clearTimeout(annT); annT=setTimeout(()=>{ P.ann=false; if (R.name==='pres') { const a=app.querySelector('.ps-ann'); if (a) a.remove(); } },1300); }

// tijdlijn: afspelen + slepen (pointer + touch-action:none)
function paintTl(){ app.querySelectorAll('[data-tl]').forEach(tl=>{ const pos = tl.dataset.tl==='ptl'?P.pos:F.pos; const h=tl.querySelector('.ph2'); if(h) h.style.left=`calc(${pos*100}% - 1px)`; }); }
app.addEventListener('pointerdown', e=>{ const tl=e.target.closest('[data-tl]'); if(!tl) return; tl.setPointerCapture(e.pointerId); const set=ev=>{ const r=tl.getBoundingClientRect(); const v=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)); if(tl.dataset.tl==='ptl') P.pos=v; else F.pos=v; paintTl(); }; set(e); const mv=ev=>set(ev), up=()=>{ tl.removeEventListener('pointermove',mv); tl.removeEventListener('pointerup',up); tl.removeEventListener('pointercancel',up); }; tl.addEventListener('pointermove',mv); tl.addEventListener('pointerup',up); tl.addEventListener('pointercancel',up); });
function stopAll(){ P.playing=false; F.playing=false; }
setInterval(()=>{
  if (R.name==='pres' && P.playing && !P.choose){ P.pos+=0.006; if (P.pos>=1){ P.pos=1; P.playing=false; if (P.auto && P.i<presList().length-1) { pGo(P.i+1); return; } render(); return; } paintTl(); }
  if (R.name==='fb' && F.playing){ F.pos+=0.006; if (F.pos>=1){ F.pos=1; F.playing=false; render(); return; } paintTl(); }
  if (R.name==='wiz3' && LOBBY.names.length<12){ LOBBY.t++; if (LOBBY.t%15===0){ LOBBY.names.push(['Yara','Noor','Sem','Milan','Lotte','Daan','Fenna','Ayoub','Julia','Zoë','Finn','Saar'][LOBBY.names.length]); const box=app.querySelector('.names'); const cnt=app.querySelector('.lobby .live'); if (box){ box.insertAdjacentHTML('beforeend',`<span>${LOBBY.names[LOBBY.names.length-1]}</span>`); cnt.textContent=LOBBY.names.length+' leerlingen zijn begonnen'; } } }
}, 80);
function afterRender(){ paintTl(); }
document.addEventListener('keydown', e=>{ if (R.name!=='pres' || ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return; if (e.key===' '){ e.preventDefault(); P.playing=!P.playing; render(); } if (e.key==='ArrowRight') pGo(P.i+1); if (e.key==='ArrowLeft') pGo(P.i-1); });

// ============================================================
//  RONDLEIDING (Volgende stap)
// ============================================================
const TOUR = [
  ['map', null, 'Dit is de <b>kaart</b> van het hele portaal. Klik op een tegel, of loop de flow door met <b>Volgende stap</b>.'],
  ['login', null, 'Inloggen (verandert nauwelijks).'],
  ['landing', null, 'Na het inloggen kom je zoals nu op de <b>docentenpagina</b> (ongewijzigd). Tik op <b>Ga naar dashboard</b>.'],
  ['dash-empty', null, 'Een <b>nieuwe docent</b> ziet één knop: maak je eerste klas.'],
  ['dash', null, '<b>Dashboard · Vandaag</b>: de klas van nu staat groot bovenaan. "Open klas" is een echte blauwe knop.'],
  ['wiz1', ()=>{ KL.cls='c2'; wzReset('c2','dash'); }, '<b>Wizard stap 1 · Kies</b> (Groep 5a). Zelf samenstellen staat nu eerst. Rechts zie je wat de leerling straks ziet.'],
  ['wiz1', ()=>{ WZ.ty='pp'; WZ.src=0; }, 'Je koos <b>Samen één plaat verklanken → Robotfabriek</b>. Het voorbeeld rechts past zich aan.'],
  ['wiz2', null, '<b>Stap 2 · Controleer & pas aan</b>: alle instellingen met goede standaardwaarden, vóórdat de code in beeld komt.'],
  ['wiz3', ()=>{ const c=cls('c2'); if(!c.active) c.active={ty:'pp',src:0,name:'Robotfabriek',since:'vandaag',dur:'',card:'Standaard',theme:'De Stad',peer:false}; LOBBY={names:[],t:0,set:false}; }, '<b>Stap 3 · Code op het bord</b>, met live namen. Met <b>Instellingen</b> kun je hier nog wijzigen.'],
  ['wiz3', ()=>{ LOBBY.set=true; }, 'Het <b>instellingenpaneel</b> op het codescherm.'],
  ['klas-bezig', ()=>{ KL.cls='c1'; }, '<b>Klas · Tijdens de les</b> (Groep 6b): wie is klaar, wie is bezig. Ververst vanzelf.'],
  ['klas-klaar', null, '<b>Klas · Klaarzetten</b>: de opdracht plus <b>Meer opties</b>.'],
  ['pres', ()=>{ KL.cls='c1'; Object.assign(P,{i:0,playing:false,pos:0,choose:true,ann:true,fb:false,mont:false,side:true}); }, '<b>Presenteren</b> begint zoals nu met de keuze "actieve opdracht of alles".'],
  ['pres', ()=>{ P.choose=false; P.playing=true; annBlink(); }, '<b>Presenteren zoals nu</b>: de plaat groot, lijst en montagelijn in- en uitklapbaar rechtsboven. Zet "Bekijk als" op Digibord.'],
  ['fb', ()=>{ KL.cls='c1'; F.f='todo'; F.a='rf'; F.cur=null; }, '<b>Feedback geven</b>: werklijst, met het beeld boven de tijdlijn en <b>Opslaan & volgende</b>.'],
  ['fb', ()=>{ store.ui.dev='phone'; applyDev(); F.cur='s1'; }, 'Dezelfde werklijst op een <b>telefoon</b>: het feedbackveld klapt open onder de aangetikte kaart.'],
  ['klas-terug', ()=>{ store.ui.dev='laptop'; applyDev(); }, '<b>Klas · Terugkijken</b>: eerdere opdrachten, delen met ouders, wat klasgenoten vonden.'],
  ['peer', null, '<b>Wat klasgenoten ervan vonden</b> (peer-feedback), los van jouw eigen feedback.'],
  ['lessen', null, '<b>Lesideeën</b>: "Zet klaar voor deze klas" springt naar stap 2 van de wizard.'],
  ['materiaal', null, '<b>Eigen materiaal</b>: uitleg voor leerlingen en templates. Einde van de rondleiding.'],
];
let TI = store.ui.ti ?? 0;
function tourGo(i){ TI=Math.max(0,Math.min(TOUR.length-1,i)); store.ui.ti=TI; save(); const [r,fn]=TOUR[TI]; R={name:r,p:{}}; MODAL=null; if (fn) fn(); if (r==='wiz3' && TOUR[TI][1] && TI>0 && TOUR[TI-1][0]==='wiz3') {} render(); window.scrollTo({top:0}); }
function tourCap(){ const idx=TOUR.findIndex((t,i)=>i===TI && t[0]===R.name); document.getElementById('tcap').innerHTML = idx>=0 ? `<b>Stap ${TI+1}/${TOUR.length}</b> · ${TOUR[TI][2]}` : `<b>Vrij rondklikken</b> · ${esc(SCREEN.title)} — klik "Volgende stap" om de rondleiding te hervatten (stap ${TI+1}).`; }
document.getElementById('tnext').onclick=()=>{ const on=TOUR[TI][0]===R.name; tourGo(on?TI+1:TI); };
document.getElementById('tprev').onclick=()=>tourGo(TI-1);

// ============================================================
//  CHROME
// ============================================================
const jump=document.getElementById('jump');
jump.innerHTML = SCREENS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
jump.onchange=()=>{ const v=jump.value; if (v.startsWith('klas')) KL.cls = v==='klas-leeg' ? 'c2' : 'c1'; if (v==='pres'){ KL.cls='c1'; Object.assign(P,{choose:false,playing:false}); } if (v==='wiz1'||v==='wiz2'||v==='wiz3'){ if (!WZ.s.card) wzReset('c1','klas'); if (v!=='wiz1' && !wzCur()){ WZ.ty='pp'; WZ.src=0; } } go(v); };
document.querySelector('.mb').addEventListener('click', e=>{ const g=e.target.closest('[data-go]'); if (g) go(g.dataset.go); const d=e.target.closest('[data-dev]'); if (d){ store.ui.dev=d.dataset.dev; save(); applyDev(); render(); } });
function applyDev(){ document.getElementById('frame').className='frame '+dev(); }
document.getElementById('tpins').onclick=e=>{ document.body.classList.toggle('nopins'); e.target.textContent=document.body.classList.contains('nopins')?'Nummers tonen':'Nummers verbergen'; };
document.getElementById('reset').onclick=()=>{ D=freshData(); KL.cls='c1'; toast('Voorbeelddata teruggezet (notities blijven bewaard)'); render(); };
document.getElementById('export').onclick=async()=>{
  const n=Object.entries(store.notes).filter(([k,v])=>v.text&&v.text.trim());
  let md=`# Feedback docentenportaal — volledige flow\n\n_Geëxporteerd: ${new Date().toLocaleString('nl-NL')}_\n\n`;
  const order = SCREENS.map(s=>s[0]);
  const groups={};
  n.forEach(([k,v])=>{ const scr=(v.label||'').split(' — ')[0]||'Overig'; (groups[scr]=groups[scr]||[]).push(v); });
  md += Object.keys(groups).length ? Object.entries(groups).map(([g,vs])=>`## ${g}\n\n`+vs.map(v=>`### ${(v.label||'').split(' — ').slice(1).join(' — ')||'Algemeen'}\n\n${v.text.trim()}\n`).join('\n')).join('\n') : '_(nog geen notities)_\n';
  let ok=false; try{ await navigator.clipboard.writeText(md); ok=true; }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download='feedback-docentenportaal-flow.md'; document.body.appendChild(a); a.click(); a.remove();
  toast(ok?'Gekopieerd én gedownload':'Gedownload als feedback-docentenportaal-flow.md');
};
applyDev();
tourGo(TI);
</script>
</body>
</html>
