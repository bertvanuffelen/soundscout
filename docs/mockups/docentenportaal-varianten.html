<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docentenportaal — varianten</title>
<style>
:root{
  --b900:#0f172a;--b800:#1e293b;--b700:#334155;--b600:#475569;--b400:#94a3b8;--b300:#cbd5e1;--b200:#e2e8f0;--b100:#f1f5f9;--b50:#f8fafc;
  --a50:#fffbeb;--a100:#fef3c7;--a300:#fcd34d;--a400:#fbbf24;--a500:#f59e0b;--a700:#b45309;--a900:#78350f;
  --teal:#0f766e;--teal1:#ccfbf1;--purp:#7e22ce;--purp1:#f3e8ff;--rose:#be123c;--rose1:#ffe4e6;
  --ok1:#dcfce7;--ok5:#22c55e;--ok7:#15803d;--warn1:#fef9c3;--warn7:#a16207;--err:#dc2626;
  --main:#0f172a;--muted:#64748b;--line:#e2e8f0;--app:#f1f5f9;
}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,"Avenir Next",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;background:#e8ebf0;color:var(--main);line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit}
.hidden{display:none!important}
h1,h2,h3,h4{margin:0;letter-spacing:-.3px}
p{margin:0}

/* ---------- Chrome van de mockup ---------- */
.top{position:sticky;top:0;z-index:50;background:#111;color:#eee;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.top b{color:var(--a400);margin-right:6px}
.top button{background:#262626;border:1px solid #444;border-radius:999px;padding:5px 12px;color:#eee}
.top button.on{background:var(--a400);color:#111;border-color:var(--a400);font-weight:800}
.top .sp{flex:1}
.top .exp{background:#14532d;border-color:#166534}
.page{max-width:1320px;margin:0 auto;padding:18px 14px 80px}
.sec-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.sec-head h1{font-size:26px}
.sec-head p{color:var(--muted);max-width:760px}
.vtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.vtabs button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;text-align:left;min-width:150px}
.vtabs button small{display:block;color:var(--muted);font-size:12px}
.vtabs button.on{border-color:var(--b900);background:var(--b900);color:#fff}
.vtabs button.on small{color:var(--b300)}
.vtabs button.now{border-style:dashed}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.side{position:sticky;top:60px;display:flex;flex-direction:column;gap:12px}
.panel{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--line)}
.panel h3{font-size:16px;margin-bottom:6px}
.panel ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.panel li{margin:2px 0}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;border-top:1px solid var(--line)}
.kv b{font-weight:900}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--b100);color:var(--b600);margin:0 4px 4px 0}
.note{background:#fff7d6;border:2px dashed #f5c518;border-radius:12px;padding:8px 10px;font-size:13px}
.note label{display:flex;font-weight:800;color:#7a5b00;margin-bottom:4px;gap:6px}
.note label .s{margin-left:auto;font-weight:600;font-size:11px;color:#8a7a3a}
.note textarea{width:100%;min-height:64px;border:1px solid #e6cf73;border-radius:8px;padding:6px 8px;background:#fffdf3;resize:vertical;font-size:13px}
body.nonotes .note{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;z-index:300;font-weight:700}

/* apparaat-frame */
.devbar{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.devbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px}
.devbar button.on{background:var(--b900);color:#fff;border-color:var(--b900)}
.devbar .reset{margin-left:auto}
.frame{background:var(--app);border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.12);overflow:hidden;margin:0 auto;border:8px solid #1f2937;transition:max-width .25s}
.frame.laptop{max-width:100%}
.frame.tablet{max-width:820px}
.frame.phone{max-width:390px}
.frame .scr{min-height:560px;position:relative}
.frame.board{border-color:#0b1020;background:var(--b900)}

/* huidig */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.shot{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;display:block;max-height:420px;object-fit:cover;object-position:top;cursor:zoom-in;background:#f8fafc}
.shot .cap{padding:10px 12px;font-size:13.5px}
.shot .cap b{display:block;margin-bottom:2px}
.shot .cap ul{margin:4px 0 0;padding-left:18px;color:#475569}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;overflow:auto;display:flex;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:min(1400px,100%);height:auto;align-self:flex-start;border-radius:8px}

/* vergelijk */
table.cmp{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14px}
table.cmp th,table.cmp td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{background:var(--b50)}
.vote{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.vote label{border:2px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer;font-weight:700}
.vote input{margin-right:6px}
.vote label.on{border-color:var(--a400);background:var(--a50)}

/* ---------- App-onderdelen in de prototypes ---------- */
.ah{background:var(--b900);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ah .lg{font-weight:900;font-size:18px}.ah .lg span{color:var(--a400)}
.ah .crumb{font-size:12px;color:var(--b300)}
.ah .r{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--b300)}
.wrap{padding:16px}
.btn{border:2px solid transparent;border-radius:999px;padding:9px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;background:#fff;border-color:var(--line)}
.btn.p{background:var(--a400);border-color:var(--a400);color:var(--a900)}
.btn.d{background:var(--b800);border-color:var(--b800);color:#fff}
.btn.g{background:transparent;border-color:transparent;color:var(--muted)}
.btn.lg{font-size:18px;min-height:56px;padding:12px 22px}
.btn.xl{font-size:22px;min-height:68px;padding:14px 28px}
.btn.full{width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.mut{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:900;letter-spacing:.12em;background:var(--a100);color:var(--a900);border-radius:12px;padding:2px 12px;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800}
.c-new{background:var(--a100);color:var(--a700)}.c-seen{background:var(--b100);color:var(--b600)}.c-done{background:var(--ok1);color:var(--ok7)}.c-wip{background:var(--warn1);color:var(--warn7)}
.c-pp{background:var(--teal1);color:var(--teal)}.c-sb{background:var(--purp1);color:var(--purp)}.c-tp{background:var(--a100);color:var(--a700)}.c-fr{background:var(--rose1);color:var(--rose)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--a500);display:inline-block}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pick{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.pick:hover{border-color:var(--a400)}
.pick.sel{border-color:var(--a400);background:var(--a50)}
.pick img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--b100)}
.ph{display:flex;align-items:center;justify-content:center;font-size:34px}
.pick .ic{font-size:28px}
.step{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.step span{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--b100);color:var(--muted)}
.step span.on{background:var(--b900);color:#fff}
.step span.done{background:var(--ok1);color:var(--ok7)}
.prog{height:6px;border-radius:999px;background:var(--b200);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--a400);transition:width .3s}
.big-q{font-size:24px;font-weight:900;margin-bottom:12px}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ans button{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left;min-height:96px}
.ans button:hover{border-color:var(--a400);background:var(--a50)}
.ans button .ic{font-size:30px;display:block}
.ans button b{display:block;font-size:16px}
.sum{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:14px}
.sum .k{color:var(--muted)}
.sum button{border:0;background:none;color:var(--a700);font-weight:800;font-size:13px}
.lobby{background:var(--b900);color:#fff;text-align:center;padding:26px 16px;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lobby .bigcode{font-family:ui-monospace,Menlo,monospace;font-weight:900;letter-spacing:.12em;font-size:clamp(64px,13vw,150px);line-height:1;color:#fff}
.lobby .url{font-size:clamp(18px,2.4vw,28px);font-weight:800}
.lobby .url span{color:var(--a400)}
.names{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.names span{background:var(--b800);border-radius:999px;padding:4px 12px;font-weight:800;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.phone-prev{width:190px;border:6px solid #111;border-radius:22px;background:#fff;overflow:hidden;font-size:11px}
.phone-prev .pp-h{background:var(--b900);color:#fff;padding:6px 8px;font-weight:800}
.phone-prev .pp-b{padding:8px}
.phone-prev ul{padding-left:14px;margin:4px 0}
details.more{border:1px solid var(--line);border-radius:12px;background:var(--b50);padding:2px 12px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:800;padding:8px 0;color:var(--b700)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.opt{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.opt select,.opt input{padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;width:100%;max-width:280px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:800;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--b900);color:#fff}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tile .n{font-weight:900}.tile .t{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{flex:1;min-width:120px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px;text-align:left}
.counter b{font-size:30px;display:block;line-height:1}
.counter.on{border-color:var(--a400);background:var(--a50)}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;color:var(--ok7)}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok5);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.listrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px;text-align:left;width:100%}
.listrow.cur{border-color:var(--a400);background:var(--a50);border-width:2px}
.listrow .grow{flex:1;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:800}
.mini-st button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 6px;font-size:15px}
.mini-st button.on{background:var(--a100);border-color:var(--a400)}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:800;text-align:left;min-height:52px}
.stk button.on{border-color:var(--a400);background:var(--a100)}
.stars button{border:0;background:none;font-size:32px;color:#cbd5e1;padding:0 2px}
.stars button.on{color:var(--a400)}
/* bord */
.bd{background:var(--b900);color:#fff;aspect-ratio:16/9;position:relative;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.frame.phone .bd,.frame.tablet .bd{aspect-ratio:auto;min-height:560px}
.bd-top{display:flex;gap:8px;align-items:center;padding:10px 14px;font-size:14px;flex-wrap:wrap}
.bd-top .sp{flex:1}
.pill{background:var(--b800);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;border:0;color:#fff}
.pill.on{background:var(--a400);color:var(--a900)}
.bd-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 14px;position:relative}
.imgbox{position:relative;max-height:100%;max-width:100%;aspect-ratio:1920/1072;height:100%}
.imgbox img{width:100%;height:100%;object-fit:contain;border-radius:10px;display:block}
.spot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:var(--b900);border:3px solid var(--a400);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0}
.spot.cur{background:var(--a400);transform:translate(-50%,-50%) scale(1.3)}
.scrub{position:relative;height:44px;background:var(--b800);border-radius:12px;touch-action:none;cursor:pointer;overflow:hidden}
.scrub .f{position:absolute;inset:0 auto 0 0;background:rgba(251,191,36,.25)}
.scrub .h{position:absolute;top:0;bottom:0;width:4px;background:#ef4444}
.scrub .ln{position:absolute;inset:16% 0;display:flex;flex-direction:column;gap:5%}
.scrub .ln div{flex:1;position:relative}
.scrub .ln i{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.85}
.tp{display:flex;gap:14px;align-items:center;justify-content:center;padding:8px}
.tb{width:56px;height:56px;border-radius:50%;border:0;background:var(--b800);color:#fff;font-size:22px}
.tb.pl{width:72px;height:72px;background:var(--a400);color:var(--a900);font-size:28px}
.qrow{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 12px}
.qrow button{flex:0 0 auto;min-width:40px;height:40px;border-radius:10px;border:0;background:var(--b800);color:var(--b300);font-weight:900;padding:0 8px}
.qrow button.cur{background:var(--a400);color:var(--a900)}
.qrow button.done{background:var(--b700);color:#fff}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:10px 14px;overflow:auto;flex:1}
.wall button{border:0;border-radius:14px;background:var(--b800);color:#fff;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.wall button .nr{font-size:26px;font-weight:900;color:var(--a400)}
.wall button.done{opacity:.55}
.wall button.cur{outline:4px solid var(--a400)}
.ann{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(15,23,42,.94);border-radius:16px;padding:10px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.ann b{display:block;font-size:24px}
.fadebar{transition:opacity .4s}
.bd.idle .fadebar{opacity:0}
.countdown{position:absolute;inset:0;background:rgba(15,23,42,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.countdown .n{font-size:90px;font-weight:900;color:var(--a400);line-height:1}
.sheet{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;color:var(--main);border-radius:16px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:94%}
.sheet button{border:0;background:var(--b100);border-radius:12px;padding:8px 10px;font-weight:800}
.swipecard{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.15);padding:18px;max-width:560px;margin:0 auto}
.bigstk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigstk button{border:2px solid var(--line);background:var(--b50);border-radius:18px;padding:14px 8px;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigstk button span{font-size:30px}
.bigstk button.on{border-color:var(--a400);background:var(--a100)}

@media (max-width:980px){.layout{grid-template-columns:1fr}.side{position:static}}
@media (max-width:600px){.opt{grid-template-columns:1fr}.stk,.bigstk{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <b>DOCENTENPORTAAL · VARIANTEN</b>
  <span id="secnav"></span>
  <span class="sp"></span>
  <button id="tn">Notities verbergen</button>
  <button class="exp" id="ex">Exporteer feedback + keuzes</button>
</div>
<div class="page" id="page"></div>

// ===================== Mini-framework voor prototypes =====================
// proto: { state:()=>({}), view:(s)=>html, act:{naam:(s,arg,ev)=>{}}, tick?:(s)=>bool }
const LIVE = new Set();
function mount(el, P){
  const s = P.state();
  const render = () => { el.innerHTML = P.view(s); if (P.after) P.after(s, el, render); };
  el._s = s; el._render = render; el._P = P;
  el.onclick = ev => {
    const a = ev.target.closest('[data-a]'); if (!a || !el.contains(a)) return;
    const [name, arg] = a.dataset.a.split(':');
    if (P.act[name]) { const r = P.act[name](s, arg, ev, el); if (r !== false) render(); }
  };
  el.oninput = ev => { const a = ev.target.closest('[data-in]'); if (a && P.act[a.dataset.in]) P.act[a.dataset.in](s, ev.target.value); };
  render();
  if (P.tick) LIVE.add(el);
}
setInterval(() => { LIVE.forEach(el => { if (!document.body.contains(el)) { LIVE.delete(el); return; } const r = el._P.tick(el._s, el); if (r === 'render') el._render(); }); }, 80);
// scrub (sleepbalk) — pointer + touch-action:none
document.addEventListener('pointerdown', e => {
  const sc = e.target.closest('[data-scrub]'); if (!sc) return;
  const host = sc.closest('.proto'); if (!host) return;
  sc.setPointerCapture(e.pointerId);
  const set = ev => { const r = sc.getBoundingClientRect(); host._s.pos = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); paintScrub(host); };
  set(e);
  const mv = ev => set(ev), up = () => { sc.removeEventListener('pointermove', mv); sc.removeEventListener('pointerup', up); sc.removeEventListener('pointercancel', up); };
  sc.addEventListener('pointermove', mv); sc.addEventListener('pointerup', up); sc.addEventListener('pointercancel', up);
});
function paintScrub(host){ host.querySelectorAll('[data-scrub]').forEach(sc => { const p = (host._s.pos||0)*100; const f = sc.querySelector('.f'), h = sc.querySelector('.h'); if (f) f.style.width = p+'%'; if (h) h.style.left = `calc(${p}% - 2px)`; }); host.querySelectorAll('[data-pp]').forEach(b => b.textContent = host._s.playing ? '⏸' : '▶'); }
function scrubHTML(seed, h){ const lanes=[0,1,2].map(l=>{let o='',b=(seed*3+l*5)%8;while(b<64){const len=4+((seed+l+b)%3)*4;o+=`<i style="left:${b/64*100}%;width:${Math.min(len,64-b)/64*100}%;background:${COLORS[(l+seed)%6]}"></i>`;b+=len+2+((seed*7+l)%6);}return `<div>${o}</div>`;}).join(''); return `<div class="scrub" data-scrub style="${h?'height:'+h+'px':''}"><div class="ln">${lanes}</div><div class="f"></div><div class="h"></div></div>`; }
function playTick(s, el){ if (!s.playing) return; s.pos = (s.pos||0) + 0.006; if (s.pos >= 1) { s.pos = 1; s.playing = false; if (el._P.act.ended) { el._P.act.ended(s, null, null, el); return 'render'; } } paintScrub(el); }

    <div class="card" style="border:2px dashed var(--b300);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);min-height:160px"><b>＋ Nieuwe klas</b><span class="xs">4 van 8 klassen gebruikt</span></div></div></div>`, act:{} }; }
function dashB(){ return { state:()=>({c:0}), view:s=>{ const c=CLS[s.c]; return appHead('Goedemiddag, Bert','maandag 13 oktober','<span>Hulp</span>')+`<div class="wrap">
    <div class="xs mut" style="font-weight:800;margin-bottom:6px">NU</div>
    <div class="card" style="border:2px solid var(--a400);display:flex;gap:14px;align-items:center;flex-wrap:wrap">${c[3]==='pp'?img('rf').replace('<img','<img style="width:170px;border-radius:12px"'):`<div class="ph" style="width:170px;border-radius:12px">${c[3]?TYPES[c[3]].ic:'📘'}</div>`}
      <div style="flex:1;min-width:200px"><h2 style="font-size:26px">${c[0]} <span class="code">${c[1]}</span></h2><p class="mut">${c[2]?`${c[2]} loopt · <b style="color:var(--main)">${c[5]} ingeleverd</b>${c[4]?` · <span class="chip c-new">${c[4]} nieuw</span>`:''}`:'Nog geen opdracht klaargezet'}</p></div>
      <div style="display:flex;flex-direction:column;gap:6px">${c[2]?'<button class="btn p lg">▶ Presenteren</button><button class="btn">⛶ Code op het bord</button><button class="btn g">Open klas</button>':'<button class="btn p lg">📘 Les kiezen</button>'}</div></div>
    <div class="xs mut" style="font-weight:800;margin:16px 0 6px">ANDERE KLASSEN</div>
    ${CLS.map((x,i)=>i===s.c?'':`<button class="listrow" data-a="c:${i}"><b style="width:90px">${x[0]}</b><span class="code">${x[1]}</span><span class="grow sm mut">${x[2]||'geen opdracht'}</span>${x[4]?`<span class="chip c-new">${x[4]} nieuw</span>`:''}<span>›</span></button>`).join('')}
    <button class="btn g">＋ Nieuwe klas (4 van 8)</button></div>`; }, act:{ c:(s,i)=>{s.c=+i;} } }; }
function dashC(){ return { state:()=>({}), view:()=>appHead('Mijn klassen','SoundScout · docent','<button class="btn p" style="min-height:34px">＋ Nieuwe klas</button>')+`<div class="wrap"><table class="tbl" style="border-radius:12px;overflow:hidden"><tr><th>Klas</th><th>Code</th><th>Opdracht</th><th>Ingeleverd</th><th>Nieuw</th><th></th></tr>
    ${[...CLS,['Groep 4','8143','Koningsdag','pp',0,3],['Groep 3','1175',null,null,0,0],['Groep 7b','2290','Drum beat','tp',6,12]].map(c=>`<tr><td><b>${c[0]}</b></td><td><span class="code">${c[1]}</span></td><td>${c[2]?`${TYPES[c[3]].ic} ${c[2]}`:'<span class="mut">— kies een opdracht</span>'}</td><td>${c[5]}</td><td>${c[4]?`<span class="chip c-new">${c[4]}</span>`:''}</td><td style="white-space:nowrap"><button class="btn g" title="Presenteren">▶</button><button class="btn g" title="Code op bord">⛶</button><button class="btn" style="min-height:32px;padding:2px 10px">Open</button></td></tr>`).join('')}</table><p class="xs mut" style="margin-top:8px">7 van 8 klassen gebruikt</p></div>`, act:{} }; }

// ===================== Overzicht =====================
const INTRO = {id:'start', nav:'Start'};

// ===================== Renderen =====================
let curSec = store.view.sec || 'start', curVar = store.view.v || {};
function nav(){
  document.getElementById('secnav').innerHTML = [INTRO,...SECTIONS].map(s=>`<button data-sec="${s.id}" class="${s.id===curSec?'on':''}">${s.nav}</button>`).join(' ');
}
document.getElementById('secnav').onclick = e => { const b=e.target.closest('[data-sec]'); if(!b) return; curSec=b.dataset.sec; store.view.sec=curSec; save(); render(); window.scrollTo(0,0); };
function render(){
  nav();
  const page = document.getElementById('page');
  if (curSec==='start') { page.innerHTML = startHTML(); return; }
  const S = SECTIONS.find(x=>x.id===curSec);
  const v = curVar[S.id] || 'nu';
  const tabs = `<div class="vtabs"><button class="now ${v==='nu'?'on':''}" data-v="nu">📷 Nu (huidig)<small>screenshots</small></button>${S.variants.map(x=>`<button class="${v===x.k?'on':''}" data-v="${x.k}">${x.k} · ${x.name}<small>${x.sub}</small></button>`).join('')}<button class="${v==='cmp'?'on':''}" data-v="cmp">⚖️ Vergelijk &amp; kies<small>tabel + jouw keuze</small></button></div>`;
  let body='';
  if (v==='nu') body = `<div class="panel" style="margin-bottom:12px"><b>Klikken nu:</b> ${S.nowClicks}. Tik op een afbeelding om hem groot te zien.</div><div class="shots">${S.now.map(([f,t,l])=>`<div class="shot"><img src="oud/${f}" alt="${t}" data-zoom loading="lazy"><div class="cap"><b>${t}</b><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`).join('')}</div><div style="margin-top:12px">${noteHTML(S.id+'-nu','Huidige situatie — '+S.title)}</div>`;
  else if (v==='cmp') body = cmpHTML(S);
  else { const V=S.variants.find(x=>x.k===v); const dev = store.view['dev-'+S.id] || (S.id==='pres'?'board':'laptop');
    body = `<div class="layout"><div><div class="devbar">Bekijk als: ${[['laptop','💻 Laptop'],['board','🖥️ Digibord'],['tablet','📱 Tablet'],['phone','📞 Telefoon']].map(([k,l])=>`<button class="${dev===k?'on':''}" data-dev="${k}">${l}</button>`).join('')}<button class="reset" data-reset>↺ opnieuw</button></div>
      <div class="frame ${dev==='board'?'laptop board':dev}"><div class="scr proto" id="proto"></div></div></div>
      <div class="side"><div class="panel"><h3>${V.k} · ${V.name}</h3><p class="sm">${V.idea}</p><div style="margin-top:8px"><span class="tag">geïnspireerd door: ${V.insp}</span></div>
        <div class="kv"><span>Klikken</span><b>${V.clicks}</b></div><div class="kv"><span>Nu</span><b>${S.nowClicks.split('(')[0]}</b></div>
        <p class="sm" style="margin-top:8px"><b>👍 Sterk</b></p><ul>${V.pros.map(x=>`<li>${x}</li>`).join('')}</ul><p class="sm" style="margin-top:6px"><b>👎 Zwak</b></p><ul>${V.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        ${noteHTML(S.id+'-'+V.k, S.title+' — variant '+V.k+' ('+V.name+')')}</div></div>`; }
  page.innerHTML = `<div class="sec-head"><div><h1>${S.title}</h1><p>${S.intro}</p></div></div>${tabs}${body}`;
  const pr = document.getElementById('proto'); if (pr) { const V=S.variants.find(x=>x.k===v); mount(pr, V.proto()); }
}
const SHOTMAP = { wizard:{nu:'oud/oud-09-opdracht-kiezen-praatplaat.jpg',A:'nieuw/nieuw-1A-stappenwizard.jpg',B:'nieuw/nieuw-1B-lesgalerij.jpg',C:'nieuw/nieuw-1C-advies.jpg',D:'nieuw/nieuw-1D-een-scherm.jpg'},
  klas:{nu:'oud/oud-07b-klaspagina-6b-boven.jpg',A:'nieuw/nieuw-2A-tabs.jpg',B:'nieuw/nieuw-2B-cockpit.jpg',C:'nieuw/nieuw-2C-twee-kolommen.jpg'},
  pres:{nu:'oud/oud-13-presentatie-digibord.jpg',A:'nieuw/nieuw-3A-afspelen.jpg',B:'nieuw/nieuw-3B-galerijwand.jpg',C:'nieuw/nieuw-3C-concert.jpg'},
  fb:{nu:'oud/oud-16-inzending-beluisteren.jpg',A:'nieuw/nieuw-4A-werklijst.jpg',B:'nieuw/nieuw-4B-snelle-kaarten.jpg',C:'nieuw/nieuw-4C-tabel.jpg'},
  dash:{nu:'oud/oud-01-dashboard-klassen.jpg',A:'nieuw/nieuw-5A-klaskaarten.jpg',B:'nieuw/nieuw-5B-vandaag.jpg',C:'nieuw/nieuw-5C-lijst.jpg'} };
function cmpHTML(S){
  const vote = (store.votes[S.id]||{});
  return `<table class="cmp"><tr><th></th><th>Nu</th>${S.variants.map(v=>`<th>${v.k} · ${v.name}</th>`).join('')}</tr>
    <tr><td><b>Beeld</b><br><span class="xs mut">tik = groot</span></td>${['nu',...S.variants.map(v=>v.k)].map(k=>`<td><img src="${SHOTMAP[S.id][k]}" data-zoom style="width:100%;max-height:170px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);cursor:zoom-in"></td>`).join('')}</tr>
    <tr><td><b>Idee</b></td><td class="sm">huidige situatie</td>${S.variants.map(v=>`<td class="sm">${v.sub}</td>`).join('')}</tr>
    <tr><td><b>Klikken</b></td><td class="sm">${S.nowClicks}</td>${S.variants.map(v=>`<td><b>${v.clicks}</b></td>`).join('')}</tr>
    <tr><td><b>Sterk</b></td><td></td>${S.variants.map(v=>`<td class="sm">${v.pros[0]}</td>`).join('')}</tr>
    <tr><td><b>Zwak</b></td><td></td>${S.variants.map(v=>`<td class="sm">${v.cons[0]}</td>`).join('')}</tr>
    <tr><td><b>Lijkt op</b></td><td></td>${S.variants.map(v=>`<td class="sm">${v.insp}</td>`).join('')}</tr></table>
    <div class="panel" style="margin-top:14px"><h3>Jouw keuze voor "${S.title}"</h3><div class="vote" data-vote="${S.id}">${[...S.variants.map(v=>[v.k,v.k+' · '+v.name]),['mix','Combinatie'],['nu','Liever zoals het nu is']].map(([k,l])=>`<label class="${vote.pick===k?'on':''}"><input type="radio" name="v-${S.id}" value="${k}" ${vote.pick===k?'checked':''}>${l}</label>`).join('')}</div>
    ${noteHTML(S.id+'-keuze','Toelichting keuze — '+S.title+' (bijv. welke onderdelen combineren)')}</div>
    ${S.id==='wizard'?`<div class="panel" style="margin-top:14px"><h3>Mijn advies</h3><p class="sm">Een combinatie van <b>B</b> en <b>D</b>: de lesgalerij met "▶ Start nu" als hoofdroute (2 klikken). Voor zelf samenstellen een kort scherm met het telefoonvoorbeeld van D. Na het starten altijd de lobby met de grote code. Variant <b>C</b> (vraaggestuurd) is interessant als hulp bij de eerste keer, maar onbewezen: die zou ik pas na een test met een paar docenten bouwen.</p></div>`:''}`;
}
document.addEventListener('change', e => { const g=e.target.closest('[data-vote]'); if(!g) return; const id=g.dataset.vote; store.votes[id]={pick:e.target.value}; save(); g.querySelectorAll('label').forEach(l=>l.classList.toggle('on', l.querySelector('input').checked)); });
document.getElementById('page').addEventListener('click', e => {
  const t=e.target.closest('[data-v]'); if (t) { curVar[curSec]=t.dataset.v; store.view.v=curVar; save(); render(); return; }
  const d=e.target.closest('[data-dev]'); if (d) { store.view['dev-'+curSec]=d.dataset.dev; save(); render(); return; }
  if (e.target.closest('[data-reset]')) { render(); return; }
  const z=e.target.closest('[data-zoom]'); if (z) { const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${z.src}">`; lb.onclick=()=>lb.remove(); document.body.appendChild(lb); return; }
  const go=e.target.closest('[data-goto]'); if (go) { const [s,v]=go.dataset.goto.split(':'); curSec=s; if(v) curVar[s]=v; render(); window.scrollTo(0,0); }
});
function startHTML(){
  return `<div class="sec-head"><div><h1>Docentenportaal — varianten om uit te kiezen</h1><p>Per scherm zie je eerst de <b>huidige situatie</b> (echte screenshots van de app met voorbeelddata) en daarna <b>drie of vier varianten</b> die je kunt aanklikken. Onder "Vergelijk &amp; kies" zet je jouw keuze. Notities en keuzes blijven in deze browser bewaard; met "Exporteer" krijg je alles als markdown.</p></div></div>
  <div class="grid g2">${SECTIONS.map(S=>`<button class="card" style="text-align:left" data-goto="${S.id}:nu"><div class="xs mut" style="font-weight:800">${S.nav}</div><h3 style="margin:4px 0">${S.title}</h3><p class="sm mut">${S.variants.length} varianten: ${S.variants.map(v=>v.k+' '+v.name).join(' · ')}</p>${store.votes[S.id]?`<p class="sm" style="margin-top:6px"><span class="chip c-done">jouw keuze: ${store.votes[S.id].pick}</span></p>`:''}</button>`).join('')}</div>
  <div class="panel" style="margin-top:14px"><h3>Zo werkt het</h3><ul><li><b>Bekijk als</b>: wissel tussen laptop, digibord, tablet en telefoon.</li><li><b>Presenteren</b>: de sleepbalk werkt met muis én vinger; ▶ speelt een demo af (zonder geluid).</li><li>De opdracht-wizard (1) is het belangrijkste onderdeel: daar staan vier varianten.</li><li>Screenshots van "nu" staan in de map <code>oud/</code> naast dit bestand; houd die map erbij.</li></ul></div>
  ${noteHTML('algemeen','Algemene indruk')}`;
}
document.getElementById('tn').onclick = e => { document.body.classList.toggle('nonotes'); e.target.textContent = document.body.classList.contains('nonotes') ? 'Notities tonen' : 'Notities verbergen'; };
document.getElementById('ex').onclick = async () => {
  let md = `# Feedback docentenportaal — varianten\n\n_Geëxporteerd: ${new Date().toLocaleString('nl-NL')}_\n\n## Keuzes\n\n`;
  SECTIONS.forEach(S => { const p = store.votes[S.id]?.pick; const V = S.variants.find(v=>v.k===p); md += `- **${S.title}:** ${p ? (V ? `${V.k} · ${V.name}` : p==='mix' ? 'combinatie' : 'zoals nu') : '_(nog geen keuze)_'}\n`; });
  md += `\n## Notities\n\n`;
  const n = Object.values(store.notes).filter(x=>x.text && x.text.trim());
  md += n.length ? n.map(x=>`### ${x.label}\n\n${x.text.trim()}\n`).join('\n') : '_(nog geen notities)_\n';
  let ok=false; try { await navigator.clipboard.writeText(md); ok=true; } catch(e) {}
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download='feedback-docentenportaal-varianten.md'; document.body.appendChild(a); a.click(); a.remove();
  toast(ok?'Gekopieerd én gedownload':'Gedownload');
};
render();
</script>
</body>
